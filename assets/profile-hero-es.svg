<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Banner de perfil de Alejandro Mata Ali</title>
  <desc id="desc">Un banner morado animado con el nombre Alejandro Mata Ali, palabras clave de investigación y una estética científica inspirada en redes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14051F"/>
      <stop offset="0.45" stop-color="#3B0764"/>
      <stop offset="1" stop-color="#0F172A"/>
      <animate attributeName="x1" values="0;120;0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;1080;1200" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 136) rotate(90) scale(144 260)">
      <stop stop-color="#A855F7" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 204) rotate(90) scale(150 280)">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="84" y1="56" x2="520" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1B4B" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#C4B5FD" stroke-opacity="0.18"/>
  <ellipse cx="250" cy="136" rx="240" ry="144" fill="url(#glowLeft)"/>
  <ellipse cx="930" cy="204" rx="260" ry="150" fill="url(#glowRight)"/>

  <rect x="56" y="44" width="700" height="286" rx="24" fill="url(#panel)" stroke="#C4B5FD" stroke-opacity="0.18"/>

  <g stroke="#C4B5FD" stroke-opacity="0.34" stroke-width="2">
    <path d="M604 236L728 170L830 202L942 146L1054 186L1148 132L1174 160">
      <animate attributeName="stroke-opacity" values="0.22;0.48;0.22" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M656 118L806 154L934 112L1068 158L1152 96L1182 126">
      <animate attributeName="stroke-opacity" values="0.18;0.42;0.18" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M594 280L746 248L896 276L1040 232L1120 258L1174 224">
      <animate attributeName="stroke-opacity" values="0.16;0.38;0.16" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#E9D5FF">
    <circle cx="728" cy="170" r="6" filter="url(#softGlow)">
      <animate attributeName="r" values="6;8;6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="942" cy="146" r="5" filter="url(#softGlow)">
      <animate attributeName="r" values="5;7;5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1148" cy="132" r="7" filter="url(#softGlow)">
      <animate attributeName="r" values="7;10;7" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="806" cy="154" r="4.5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="258" r="5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="5.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#F5F3FF" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="94" y="108" font-size="18" letter-spacing="2.4" fill="#DDD6FE">TENSOR NETWORKS · QUANTUM COMPUTING · AI</text>
    <text x="94" y="184" font-size="58" font-weight="700">Alejandro Mata Ali</text>
    <text x="94" y="238" font-size="23" font-weight="600" fill="#F3E8FF">Investigador · Desarrollador de software cient&#237;fico</text>
    <text x="94" y="274" font-size="23" font-weight="600" fill="#F3E8FF">Docente · Divulgador cient&#237;fico</text>
  </g>
</svg>
