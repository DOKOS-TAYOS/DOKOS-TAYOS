<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Banner de perfil de Alejandro Mata Ali</title>
  <desc id="desc">Un banner morado animado con el nombre Alejandro Mata Ali, palabras clave de investigación y una estética científica inspirada en redes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14051F"/>
      <stop offset="0.45" stop-color="#3B0764"/>
      <stop offset="1" stop-color="#0F172A"/>
      <animate attributeName="x1" values="0;120;0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;1080;1200" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 124) rotate(90) scale(126 240)">
      <stop stop-color="#A855F7" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 188) rotate(90) scale(130 260)">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="84" y1="56" x2="520" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1B4B" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#312E81" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="#C4B5FD" stroke-opacity="0.18"/>
  <ellipse cx="250" cy="124" rx="240" ry="126" fill="url(#glowLeft)"/>
  <ellipse cx="930" cy="188" rx="260" ry="130" fill="url(#glowRight)"/>

  <rect x="72" y="54" width="500" height="212" rx="24" fill="url(#panel)" stroke="#C4B5FD" stroke-opacity="0.18"/>

  <g stroke="#C4B5FD" stroke-opacity="0.34" stroke-width="2">
    <path d="M454 214L578 152L680 182L792 128L934 168L1078 116L1146 144">
      <animate attributeName="stroke-opacity" values="0.22;0.48;0.22" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M506 104L656 138L784 96L918 142L1072 82L1162 110">
      <animate attributeName="stroke-opacity" values="0.18;0.42;0.18" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M444 256L596 226L746 252L890 208L1040 236L1136 200">
      <animate attributeName="stroke-opacity" values="0.16;0.38;0.16" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#E9D5FF">
    <circle cx="578" cy="152" r="6" filter="url(#softGlow)">
      <animate attributeName="r" values="6;8;6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="792" cy="128" r="5" filter="url(#softGlow)">
      <animate attributeName="r" values="5;7;5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1078" cy="116" r="7" filter="url(#softGlow)">
      <animate attributeName="r" values="7;10;7" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="656" cy="138" r="4.5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="236" r="5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="5.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#F5F3FF" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="110" y="104" font-size="16" letter-spacing="3.0" fill="#DDD6FE">INVESTIGACI&#211;N · SOFTWARE · DOCENCIA · DIVULGACI&#211;N</text>
    <text x="110" y="162" font-size="54" font-weight="700">Alejandro Mata Ali</text>
    <text x="110" y="205" font-size="21" font-weight="600" fill="#F3E8FF">Investigador · Desarrollador de software cient&#237;fico</text>
    <text x="110" y="235" font-size="21" font-weight="600" fill="#F3E8FF">Docente · Divulgador cient&#237;fico</text>
  </g>
</svg>
