<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Scientific profile banner in purple</title>
  <desc id="desc">An animated purple banner with network lines, glowing nodes, and a clean professional aesthetic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14051F"/>
      <stop offset="0.45" stop-color="#3B0764"/>
      <stop offset="1" stop-color="#0F172A"/>
      <animate attributeName="x1" values="0;120;0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;1080;1200" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 128) rotate(90) scale(120 240)">
      <stop stop-color="#A855F7" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 188) rotate(90) scale(130 260)">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="#C4B5FD" stroke-opacity="0.18"/>

  <ellipse cx="270" cy="128" rx="250" ry="120" fill="url(#glowLeft)">
    <animate attributeName="rx" values="250;270;250" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="930" cy="188" rx="260" ry="130" fill="url(#glowRight)">
    <animate attributeName="ry" values="130;150;130" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#C4B5FD" stroke-opacity="0.38" stroke-width="2">
    <path d="M92 230L208 176L314 206L418 132L534 170L652 110L786 146L930 92L1088 142">
      <animate attributeName="stroke-opacity" values="0.22;0.5;0.22" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M118 92L250 126L374 86L474 144L610 82L736 118L854 72L1008 104">
      <animate attributeName="stroke-opacity" values="0.18;0.42;0.18" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M174 268L314 206L464 236L626 202L786 228L956 180L1084 214">
      <animate attributeName="stroke-opacity" values="0.16;0.4;0.16" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#E9D5FF">
    <circle cx="208" cy="176" r="6" filter="url(#softGlow)">
      <animate attributeName="r" values="6;8;6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="418" cy="132" r="5" filter="url(#softGlow)">
      <animate attributeName="r" values="5;7;5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="652" cy="110" r="6" filter="url(#softGlow)">
      <animate attributeName="r" values="6;9;6" dur="6.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="92" r="7" filter="url(#softGlow)">
      <animate attributeName="r" values="7;10;7" dur="5.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="126" r="4.5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="82" r="5.5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="956" cy="180" r="5" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="5.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#F5F3FF" fill-opacity="0.16" stroke="#E9D5FF" stroke-opacity="0.32">
    <rect x="92" y="74" width="180" height="18" rx="9">
      <animate attributeName="opacity" values="0.35;0.65;0.35" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="120" width="468" height="34" rx="17">
      <animate attributeName="width" values="468;500;468" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="170" width="392" height="34" rx="17">
      <animate attributeName="width" values="392;430;392" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="230" width="286" height="18" rx="9">
      <animate attributeName="opacity" values="0.28;0.54;0.28" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
